<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRL Admin Password Recovery</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;min-height:100vh;display:grid;place-items:center;color:#172033}
main{background:#fff;width:min(420px,calc(100% - 40px));padding:28px;border-radius:16px;box-shadow:0 12px 36px #16213e18;box-sizing:border-box}
h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;color:#526078}label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd3df;border-radius:8px;font-size:16px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:#2349a3;color:white;font-size:16px;font-weight:700;cursor:pointer}
#status{margin-top:16px;padding:12px;border-radius:8px;background:#f3f5f9;overflow-wrap:anywhere}.small{font-size:13px}
</style></head><body><main>
<h1>VRL Admin Password Recovery</h1>
<p>Use this page only after opening a fresh password-recovery email sent by your VRL Supabase project.</p>
<form id="form">
<label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters">
<label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required placeholder="Enter it again">
<button id="submit" type="submit">Update password</button></form>
<div id="status" role="status">Waiting for a valid recovery session from Supabase…</div>
<p class="small">Never share your recovery link or password. This page does not store your password.</p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase = createClient('https://yjdkjidcjafshwsaiado.supabase.co','sb_publishable_loBuMyOma1KzaXtLNwyQNA_OfClFhUT');
const statusEl=document.getElementById('status'), form=document.getElementById('form'), submit=document.getElementById('submit');
let ready=false; const status=m=>statusEl.textContent=m;
try {
 const hash=new URLSearchParams(location.hash.slice(1)), query=new URLSearchParams(location.search);
 const err=hash.get('error_description')||query.get('error_description');
 if(err) status('Supabase rejected this recovery link: '+err+'. Request a new recovery email, then open the newest link.');
 else { const {data,error}=await supabase.auth.getSession(); if(error) throw error;
 if(data.session){ready=true;status('Recovery session found. Enter and confirm your new password.');}
 else status('No recovery session found. Open a fresh recovery email link while this local page is running.'); }
} catch(e){status('Could not validate the recovery session. '+(e.message||'Please request a fresh recovery email.'));}
form.addEventListener('submit',async e=>{
 e.preventDefault(); const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(p.length<10)return status('Use a password with at least 10 characters.');
 if(p!==c)return status('The passwords do not match.');
 if(!ready)return status('A valid recovery session is required. Request a fresh email and open its link.');
 submit.disabled=true;submit.textContent='Updating…';
 const {error}=await supabase.auth.updateUser({password:p});
 if(error){status('Password update failed: '+error.message+'. The recovery link may have expired; request a new one.');submit.disabled=false;submit.textContent='Update password';return;}
 status('Password updated successfully. Sign in to the VRL Admin Console with your admin VRL ID and this new password.');form.reset();
});
</script></body></html>
